name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m compileall -q .

      - name: Offline self-check (no API key, no network)
        run: make verify

      - name: Decision client self-test
        run: python harness/decision_client.py --selftest

      - name: Lint (non-blocking)
        run: |
          python -m pip install --quiet ruff
          ruff check . || true
